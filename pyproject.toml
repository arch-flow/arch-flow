[project]
name = "archflow"
version = "0.1.0"
description = "Local-first flow runner with ephemeral config UI"
readme = "README.md"
authors = [
    { name = "ViniciusInTech", email = "vini989073599@gmail.com" }
]
[tool.isort]
profile = "black"
line_length = 88
requires-python = ">=3.12.3"
dependencies = [
    "typer>=0.19.2",
    "rich>=14.2.0",
    "mypy>=1.11",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "greenlet>=3.0.3",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "certifi>=2025.8.3",
    "idna>=3.10",
    "iniconfig>=2.1.0",
    "python-dotenv>=1.1.1",
    "ruff>=0.13.3",
    "starlette>=0.48.0",
]

[project.scripts]
flow = "apps.cli.main:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.13.3",
]
