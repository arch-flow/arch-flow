[project]
name = "archflow"
version = "0.1.0"
description = "Local-first flow runner with ephemeral config UI"
readme = "README.md"
authors = [
    { name = "ViniciusInTech", email = "vini989073599@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.19.2",
    "rich>=14.2.0",
]

[project.scripts]
flow = "apps.cli.main:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.13.3",
]
