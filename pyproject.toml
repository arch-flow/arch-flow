[project]
name = "archflow"
version = "0.1.0"
description = "Local-first flow runner with ephemeral config UI"
readme = "README.md"
authors = [
    { name = "ViniciusInTech", email = "vini989073599@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.118.0",
    "pydantic>=2.11.9",
    "sqlalchemy>=2.0.43",
    "typer>=0.19.2",
    "uvicorn>=0.37.0",
]

[project.scripts]
flow = "cli.main:app"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.13.3",
]
